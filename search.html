<div class="wrap narrow" style="padding-bottom:72px"><label for="q" class="sr">Search</label><input id="q" class="search" type="search" placeholder="Try &quot;Cuban&quot;, &quot;Tampa&quot;, &quot;shrimp&quot;..." autofocus><div id="res" aria-live="polite"></div></div></main>
<script src="/js/app.js" defer></script><script src="/js/search.js"></script><script>
const q=document.getElementById('q'),r=document.getElementById('res');const p=new URLSearchParams(location.search).get('q');if(p)q.value=p;
const e=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function run(){const t=q.value.trim();if(!t){r.innerHTML='';return}const hits=siteSearch.find(t);
r.innerHTML=hits.length?hits.map(x=>`<a class="sres" href="${e(x.u)}"><span class="kicker">${e(x.c)}</span><h3>${e(x.t)}</h3><p>${e(x.s)}</p></a>`).join(''):'<p>No matches. Try a dish, city or cuisine.</p>'}
siteSearch.load().then(()=>{q.oninput=run;run()});</script><footer><div class="wrap"><p class="logo">Sam's Table</p><p>Pull up a chair. There's always room at the table.</p><p><a href="index.html">Home</a><a href="recipes.html">Recipes</a><a href="reviews.html">Reviews</a><a href="travel.html">Travel</a><a href="food-guide.html">Food Guide</a><a href="gallery.html">Gallery</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="/about.html#app">Get the app</a></p><p>&copy; 2026 Sam's Table · Real food, real photos</p></div></footer><script data-goatcounter="https://samstable.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
