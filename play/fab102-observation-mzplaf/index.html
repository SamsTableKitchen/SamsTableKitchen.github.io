<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#5E7033">
<title>FAB 102 Observation · Sam's Table</title>
<style>
:root{--bg:#FAF7F2;--ink:#2B2B2B;--olive:#5E7033;--terra:#A0502A;--line:#E6DFD3;--ok:#2f7d3b;--bad:#b3261e;--c1:#e07a2f;--c2:#2a8f9e;--c3:#7b4fb3;--c4:#c2406b;--c0:#5E7033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 120px}
h1{font-family:Georgia,serif;color:var(--terra);font-size:1.6rem;margin:.3em 0}.sub{color:#555;margin:0 0 10px}
details{background:#fff;border:1px solid var(--line);border-left:8px solid var(--c,#5E7033);border-radius:16px;margin:12px 0;box-shadow:0 2px 6px #0000000d}
summary{list-style:none;padding:16px;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:56px}
summary::-webkit-details-marker{display:none}summary::after{content:"▾";margin-left:auto;transition:none}details[open] summary::after{content:"▴"}
.cnt{font-size:.85rem;padding:4px 10px;border-radius:99px;background:#eee;color:#555;white-space:nowrap}.cnt.done{background:var(--ok);color:#fff}
.body{padding:0 16px 16px}label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=datetime-local],textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fffdf9;min-height:48px}
textarea{min-height:64px;resize:vertical}input:focus,textarea:focus{outline:3px solid #5e703355;border-color:var(--olive)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;border:2px solid var(--c2);color:var(--c2);background:#fff;border-radius:99px;padding:10px 16px;min-height:48px}
.chip.on{background:var(--c2);color:#fff}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;font-weight:500}
.chk input{width:28px;height:28px;flex:none;accent-color:var(--olive)}
.item{border-top:1px dashed var(--line);padding:12px 0}.item .t{font-weight:600;margin-bottom:8px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.tri button{font:inherit;font-weight:700;min-height:52px;border-radius:12px;border:2px solid #ccc;background:#fff;color:#555}
.tri .ok.on{background:var(--ok);border-color:var(--ok);color:#fff}.tri .bad.on{background:var(--bad);border-color:var(--bad);color:#fff}.tri .ns.on{background:#777;border-color:#777;color:#fff}
.note{font-style:italic;color:#666;font-size:.95rem;background:#fff6e5;padding:8px 12px;border-radius:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;min-height:52px;color:#fff;background:var(--olive);width:100%;margin:6px 0}
.btn.alt{background:var(--c2)}.btn.warn{background:#fff;color:var(--bad);border:2px solid var(--bad)}.btn.sm{background:#fff;color:var(--c3);border:2px dashed var(--c3)}
.fc{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;margin:6px 0;background:#f3f0ea;font-weight:600}.fc.y{background:#e3f3e5;color:var(--ok)}
#photo img{max-width:100%;border-radius:12px;margin-top:8px}.saved{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#2B2B2Bcc;color:#fff;padding:6px 14px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .4s}
.saved.show{opacity:1}
</style></head><body><div class="wrap">
<h1>🍽️ FAB 102 Restaurant Observation</h1>
<p class="sub">Fill this in during your visit. Everything saves on this phone automatically.</p>
<div id="app"></div>
<div style="margin-top:16px"><button class="btn" id="copy">📋 Copy as text</button><button class="btn alt" id="share">📤 Download / Share</button><button class="btn warn" id="reset">🧹 Start new visit</button></div>
</div><div class="saved" id="saved">Saved ✓</div>
<script>
const KEY='fab102-obs-v1';
const VISIT=[['name','Your name'],['rest','Restaurant name'],['addr','Address/location'],['dt','Date and time of visit','datetime'],['style','Style of service','chips'],['why','Why you chose it','ta'],['layout','Layout (how much of the kitchen can you see?)','ta'],['equip','Equipment you can identify','ta'],['ordered','What you ordered','ta']];
const VCHK=[['openk','Open kitchen, not fast food, buffet, sushi bar, or your workplace'],['rcpt','Receipt saved (purchase date must match report date)']];
const STYLES=['Counter','Fast-casual','Table'];
const CATS=[
['hyg','1. Employee personal hygiene',['Hands washed between tasks (after handling money, phone, trash, raw food)','Gloves worn for ready-to-eat food and changed when needed','Hair restrained (hat, hairnet, beard cover)','Clean uniform or apron','Jewelry limited to a plain band, no watches or bracelets','Fingernails short, clean, no polish or fake nails','No eating, drinking, gum, or phone use in prep areas','Employees appear healthy (no coughing, sneezing, visible illness)','Cuts or wounds covered and gloved','Other']],
['fac','2. Facility',['Handwashing sink visible, stocked (soap, towels), and used only for hands','Floors clean, dry, no spills or debris','Food-contact surfaces and cutting boards clean','Sanitizer buckets or wiping cloths in use and stored properly','Trash cans covered, not overflowing','No signs of pests (flies, droppings, open doors)','Lighting adequate, no broken or unshielded bulbs','Equipment in good repair (no rust, cracks, duct tape)','Dining area, tables, and condiments clean','Restroom clean and stocked','Health inspection grade or certificate posted','Other']],
['food','3. Food and beverage handling',['Raw meat kept separate from ready-to-eat food (no cross-contamination)','Thermometer used to check cooking or holding temps','Hot food held hot, cold food held cold (steam tables, ice, refrigeration)','Food covered or protected from sneezes, dust, and customers','Food stored off the floor, nothing sitting out at room temperature','Utensils handled by the handle, scoops not left in product','Ready-to-eat food touched only with gloves, tongs, or deli paper','Date labels or FIFO rotation visible on containers','Drinks, ice, and cups handled without touching rims or ice with hands','Allergen awareness (asked about allergies, separate prep)','Other']]];
const WRAP=[['strength','Biggest sanitation strength I saw'],['problem','Most serious problem I saw'],['surprise','Was anything surprising or unexpected? Why?'],['rec1','Recommendation 1 (name the ServSafe principle)'],['rec2','Recommendation 2 (name the ServSafe principle)'],['rec3','Recommendation 3 (optional)']];
const COLORS=['--c0','--c1','--c2','--c3','--c4'];
let S=load();
function blank(){return{v:{},chk:{},items:{},extra:0,photo:'',open:{v:true},fin:{}}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return blank()}}
let st;function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save (storage full?). Try removing the photo.')}const s=document.getElementById('saved');s.classList.add('show');clearTimeout(st);st=setTimeout(()=>s.classList.remove('show'),900)}
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function catItems(c){const a=c[2].map((t,i)=>[c[0]+i,t]);if(c[0]=='food')for(let k=0;k<S.extra;k++)a.push(['foodx'+k,'Other']);return a}
function count(c){return catItems(c).filter(([id])=>{const it=S.items[id]||{};return(it.s=='ok'||it.s=='bad')&&(it.n||'').trim()}).length}
function sec(id,title,ci,inner,cnt){return`<details data-id="${id}" style="--c:var(${COLORS[ci]})" ${S.open[id]?'open':''}><summary>${title}${cnt!==undefined?`<span class="cnt" id="cnt-${id}"></span>`:''}</summary><div class="body">${inner}</div></details>`}
function field(k,l,t){const v=esc(S.v[k]);if(t=='datetime')return`<label for="v-${k}">${l}</label><input type="datetime-local" id="v-${k}" data-v="${k}" value="${v}">`;
if(t=='chips'){const cur=S.v.style||'';const isOther=cur&&!STYLES.includes(cur);return`<label>${l}</label><div class="chips">${STYLES.concat('Other').map(s=>`<button type="button" class="chip ${(s==cur||(s=='Other'&&isOther))?'on':''}" data-chip="${s}">${s}</button>`).join('')}</div><input type="text" id="styleOther" placeholder="Describe other style" value="${isOther?esc(cur=='Other'?'':cur):''}" style="margin-top:8px;${isOther?'':'display:none'}">`}
return`<label for="v-${k}">${l}</label>${t=='ta'?`<textarea id="v-${k}" data-v="${k}">${v}</textarea>`:`<input type="text" id="v-${k}" data-v="${k}" value="${v}">`}`}
function render(){let h='';
h+=sec('v','📍 Visit info',0,VISIT.map(f=>field(...f)).join('')+VCHK.map(([k,l])=>`<label class="chk"><input type="checkbox" data-c="${k}" ${S.chk[k]?'checked':''}>${l}</label>`).join('')+`<label>Receipt photo (optional)</label><input type="file" accept="image/*" capture="environment" id="pfile"><div id="photo">${S.photo?`<img src="${S.photo}" alt="Receipt"><button class="btn warn" id="pdel" type="button">Remove photo</button>`:''}</div>`);
CATS.forEach((c,ci)=>{h+=sec(c[0],c[1]+' <small style="font-weight:400">(need 5+)</small>',ci+1,`<p class="note">Write what you actually saw, not a guess.</p>`+catItems(c).map(([id,t])=>{const it=S.items[id]||{};return`<div class="item"><div class="t">${t}</div><div class="tri" data-i="${id}">${[['ok','OK ✓'],['bad','Problem ✗'],['ns','Not seen']].map(([s,l])=>`<button type="button" class="${s} ${it.s==s?'on':''}" data-s="${s}">${l}</button>`).join('')}</div><textarea data-n="${id}" placeholder="What I saw">${esc(it.n)}</textarea></div>`}).join('')+(c[0]=='food'?`<button class="btn sm" id="addo" type="button">➕ Add another "Other"</button>`:''),1)});
h+=sec('w','✅ 4. Wrap-up',4,WRAP.map(([k,l])=>field(k,l,'ta')).join('')+`<label>Final checks</label><div id="fc"></div><label class="chk"><input type="checkbox" data-f="rph" ${S.fin.rph?'checked':''}>Receipt photographed or saved</label><label class="chk"><input type="checkbox" data-f="dm" ${S.fin.dm?'checked':''}>Dates on receipt and report match</label>`);
document.getElementById('app').innerHTML=h;upd()}
function upd(){let all=true;CATS.forEach(c=>{const n=count(c),e=document.getElementById('cnt-'+c[0]);e.textContent=Math.min(n,99)+' of 5';e.classList.toggle('done',n>=5);if(n<5)all=false});
document.getElementById('fc').innerHTML=`<div class="fc ${all?'y':''}">${all?'✅':'⬜'} 5+ observations recorded in each of the three categories (${CATS.map(c=>count(c)).join(' / ')})</div>`}
const app=document.getElementById('app');
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.v){S.v[t.dataset.v]=t.value}else if(t.dataset.n){(S.items[t.dataset.n]=S.items[t.dataset.n]||{}).n=t.value;upd()}else if(t.id=='styleOther'){S.v.style=t.value||'Other'}else return;save()});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.c){S.chk[t.dataset.c]=t.checked;save()}else if(t.dataset.f){S.fin[t.dataset.f]=t.checked;save()}else if(t.id=='pfile'&&t.files[0])photo(t.files[0])});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.s){const id=b.parentNode.dataset.i,it=S.items[id]=S.items[id]||{};it.s=it.s==b.dataset.s?'':b.dataset.s;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.s==it.s));upd();save()}
else if(b.dataset.chip){const c=b.dataset.chip;S.v.style=S.v.style==c?'':c;const o=document.getElementById('styleOther');o.style.display=c=='Other'&&S.v.style?'':'none';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.chip==S.v.style));if(S.v.style=='Other')o.focus();save()}
else if(b.id=='addo'){S.extra++;save();render()}else if(b.id=='pdel'){S.photo='';save();render()}});
app.addEventListener('toggle',e=>{const d=e.target;if(d.tagName=='DETAILS'){S.open[d.dataset.id]=d.open;save()}},true);
function photo(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1000,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.7);save();render()};im.src=r.result};r.readAsDataURL(f)}
const L={ok:'OK',bad:'PROBLEM',ns:'Not seen'};
function fmtDt(v){if(!v)return'';const d=new Date(v);return isNaN(d)?v:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function text(){let o=['FAB 102 RESTAURANT OBSERVATION',''];VISIT.forEach(([k,l,t])=>o.push(l+': '+(t=='datetime'?fmtDt(S.v[k]):(S.v[k]||'')).trim()));VCHK.forEach(([k,l])=>o.push('['+(S.chk[k]?'x':' ')+'] '+l));o.push('Receipt photo: '+(S.photo?'attached on phone':'none'));
CATS.forEach(c=>{o.push('',c[1].toUpperCase()+' ('+count(c)+' observations)');catItems(c).forEach(([id,t])=>{const it=S.items[id]||{};if(!it.s&&!(it.n||'').trim())return;o.push('- '+t+': '+(L[it.s]||'—')+((it.n||'').trim()?' — '+it.n.trim():''))})});
o.push('','WRAP-UP');WRAP.forEach(([k,l])=>o.push(l+': '+(S.v[k]||'').trim()));const all=CATS.every(c=>count(c)>=5);o.push('','FINAL CHECKS','['+(all?'x':' ')+'] 5+ observations recorded in each of the three categories','['+(S.fin.rph?'x':' ')+'] Receipt photographed or saved','['+(S.fin.dm?'x':' ')+'] Dates on receipt and report match');return o.join('\n')}
document.getElementById('copy').onclick=async()=>{const t=text();try{await navigator.clipboard.writeText(t);alert('Copied! Paste it into your report.')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('Copied!')}};
document.getElementById('share').onclick=async()=>{const t=text(),fn='FAB102-'+((S.v.rest||'observation').replace(/[^\w]+/g,'-'))+'.txt';if(navigator.share){try{await navigator.share({title:'FAB 102 Observation',text:t});return}catch(e){if(e.name=='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=fn;a.click()};
document.getElementById('reset').onclick=()=>{if(confirm('Start a new visit? This clears everything on this form.')){S=blank();save();render();scrollTo(0,0)}};
render();
</script></body></html>
