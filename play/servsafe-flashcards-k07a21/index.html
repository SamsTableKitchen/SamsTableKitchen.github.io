 11}, {"t": "Calibration", "d": "Adjusting a thermometer to a known standard (freezing or boiling point of water) so it reads accurately.", "c": 5}, {"t": "Carriers", "d": "People who carry pathogens and infect others, yet never get sick themselves.", "c": 4}, {"t": "Centers for Disease Control and Prevention (CDC)", "d": "Agency of the U.S. Department of Health and Human Services that investigates outbreaks, studies disease, publishes data, provides sanitation education, and runs the Vessel Sanitation Program.", "c": 14}, {"t": "Cleaning", "d": "Removing food and other dirt from a surface, such as a countertop or plate.", "c": 12}, {"t": "Concentration", "d": "Amount of sanitizer for a given amount of water, measured in parts per million (ppm).", "c": 12}, {"t": "Contamination", "d": "Presence of harmful substances in food. Some occur naturally; others are introduced by people or the environment.", "c": 1}, {"t": "Coving", "d": "Curved, sealed edge between the floor and wall that removes hard-to-clean corners, eliminates pest hiding places, and protects walls from moisture.", "c": 11}, {"t": "Critical control points (CCPs)", "d": "In HACCP, the points where you can prevent, eliminate, or reduce hazards to safe levels.", "c": 10}, {"t": "Cross-connection", "d": "Physical link through which contaminants from drains, sewers, or wastewater can enter drinkable water (e.g., a hose from a faucet submerged in a mop bucket).", "c": 11}, {"t": "Cross-contact", "d": "Transfer of an allergen from a food or surface to a food that does not contain that allergen.", "c": 3}, {"t": "Cross-contamination", "d": "Transfer of pathogens from one surface or food to another.", "c": 1}, {"t": "Date-marking", "d": "Date placed on ready-to-eat TCS food held more than 24 hours, showing when it must be sold, eaten, or thrown out (max 7 days at 41\u00b0F or lower).", "c": 7}, {"t": "Degreasers", "d": "Detergents that contain a grease-dissolving agent.", "c": 12}, {"t": "Delimers", "d": "Cleaners for mineral deposits and soils other cleaners cannot remove, such as scale, rust, and tarnish.", "c": 12}, {"t": "Detergents", "d": "Cleaners that penetrate and soften dirt to help remove it from a surface.", "c": 12}, {"t": "Employees FIRST", "d": "FDA tool to raise employee awareness of food defense: Follow, Inspect, Recognize, Secure, Tell.", "c": 3}, {"t": "Expiration date", "d": "Last date recommended for a product to be at peak quality (same as use-by date).", "c": 6}, {"t": "FAT TOM", "d": "The conditions bacteria need to grow: Food, Acidity, Temperature, Time, Oxygen, Moisture.", "c": 2}, {"t": "FDA Food Code", "d": "Science-based recommendations on food safety regulations for city, county, state, and tribal agencies (restaurants and retail, vending, schools and daycare, hospitals and nursing homes).", "c": 14}, {"t": "Fecal-oral route", "d": "Pathogens move from a person\u2019s feces to their hands, then from unwashed hands to food eaten by someone else.", "c": 2}, {"t": "First-in, first-out (FIFO)", "d": "Stock rotation: shelve by use-by or expiration date so the oldest products are used first.", "c": 7}, {"t": "Flow of food", "d": "Path food takes through an operation: purchasing, receiving, storing, preparing, cooking, holding, cooling, reheating, serving.", "c": 5}, {"t": "Food allergen", "d": "A naturally occurring protein in a food or ingredient that the immune system mistakenly attacks, causing an allergic reaction.", "c": 3}, {"t": "Food and Drug Administration (FDA)", "d": "Federal agency that inspects all food except meat, poultry, and eggs; regulates food crossing state lines; issues the FDA Food Code.", "c": 14}, {"t": "Food codes", "d": "State or local food safety regulations for retail and foodservice operations.", "c": 14}, {"t": "Food defense program", "d": "Program an operation develops to prevent deliberate contamination of its food.", "c": 3}, {"t": "Food safety management system", "d": "Group of programs, procedures, and measures that
